# Configuration is read from .github/project.yml - no inputs needed!
name: npm Build

on:
  # Required so the 'build / conclusion' status check runs on the merge-queue
  # branch; without it, queued PRs stay CLEAN but never merge (queue times out).
  merge_group:
  push:
    branches: [main, "dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-npm-build.yml@a7e76c841bc9bf8bb91be66c979762724956016c # v0.46.0
