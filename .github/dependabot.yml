version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only `default-days`: the `semver-*-days` keys are rejected for the
    # github-actions ecosystem, and one rejected key invalidates the whole file,
    # which disables version updates for the entire repo. They stay on `npm`
    # below, which does support them.
    cooldown:
      default-days: 3
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
