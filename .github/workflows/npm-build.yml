# Configuration is read from .github/project.yml - no inputs needed!
name: npm Build

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-npm-build.yml@830c2dd2ffe4850be37c5faa0a0d112713dfd7e3 # v0.14.0
