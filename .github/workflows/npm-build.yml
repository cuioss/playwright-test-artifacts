# Configuration is read from .github/project.yml - no inputs needed!
name: npm Build

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-npm-build.yml@146d2d377eea7ffae0c73f06df8087a0948a534a # v0.22.0
