# Configuration is read from .github/project.yml - no inputs needed!
name: npm Build

on:
  # Required so the 'build / conclusion' status check runs on the merge-queue
  # branch; without it, queued PRs stay CLEAN but never merge (queue times out).
  merge_group:
  push:
    branches: [main, "dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-npm-build.yml@3e1ecafb6a194fe22fc6a9bfdc2a41c81584f989 # v0.43.0
